<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture with existing answers</title></head>
<body>
  <form action="/submitted" method="post">
    <label>First name <input name="first_name" value="Manually entered" required></label>
    <label for="email-label-input" id="email-label">Email address</label>
    <input id="email-label-input" name="email" type="email" aria-labelledby="email-label" required>
    <label>Middle name <input name="middle_name"></label>
    <label>Phone number <input name="phone" type="tel" disabled></label>
    <label>Last name <input name="last_name" hidden></label>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
