<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture that changes an earlier field</title></head>
<body>
  <form>
    <label>First name <input name="first_name" required></label>
    <label>Last name <input name="last_name" required></label>
  </form>
  <script>
    document.querySelector('[name=last_name]').addEventListener('input', () => {
      document.querySelector('[name=first_name]').value = 'Changed by page';
    });
  </script>
</body>
</html>
