<!doctype html><html lang="en"><meta charset="utf-8"><title>Otium demo application</title><link rel="stylesheet" href="/style.css">
<main class="demo"><span class="eyebrow">OTIUM TEST ENVIRONMENT</span><h1>Developer Tools Intern</h1><p>This is a local sample form. No employer receives this information.</p>
<form><div class="field-grid"><label>First name<input name="first_name" autocomplete="given-name" required></label><label>Last name<input name="last_name" autocomplete="family-name" required></label><label>Email address<input type="email" name="email" required></label><label>Phone number<input type="tel" name="phone"></label><label>Country<select name="country" required><option value="">Choose country</option><option>United States</option><option>Canada</option></select></label><label>University<input name="school"></label></div>
<label>What interests you about this role?<textarea name="motivation" required></textarea></label><label>Tell us about a project you are proud of<textarea name="project" required></textarea></label><label>Are you legally authorized to work?<select required><option value="">Choose an answer</option><option>Yes</option><option>No</option></select></label><label class="check"><input type="checkbox" required> I certify that the information is accurate</label><button disabled>Demo only · submission unavailable</button></form></main></html>
